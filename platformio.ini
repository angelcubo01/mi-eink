[platformio]
default_envs = trmnl_og_diy

[env:trmnl_og_diy]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
extra_scripts = pre:scripts/platformio_pre.py
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.7.7
    bblanchon/ArduinoJson@7.4.2
    https://github.com/bitbank2/bb_epaper.git#0395f302d54f146958133b231ab325fe27f72f2f
